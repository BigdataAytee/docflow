# v6 §Q Phase 0: the money property tests go into CI on day one and
# "run on every commit for the life of the project".
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Zero-errors policy (CLAUDE.md).
      - name: Typecheck
        run: npm run typecheck

      # Includes docflow/no-hardcoded-type-name — Rule #5, one word everywhere.
      - name: Lint
        run: npm run lint

      # Blocking before merge: money property tests (fast-check) and
      # lifecycle transition tests (CLAUDE.md).
      - name: Money and lifecycle tests
        run: npm test

      - name: Build
        run: npm run build
