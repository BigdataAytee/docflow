# v6 §Q Phase 0: the money property tests go into CI on day one and
# "run on every commit for the life of the project".
# v6 §Q Phase 1: the two-account RLS denial suite joins them as a blocking check.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The store-screenshot capture (§T) needs a browser; CI never runs it, and
# downloading ~150 MB of Chromium on every job to leave it unused would make
# every check slower for nothing. `npm run shots` is a local command.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  verify:
    name: typecheck · lint · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Zero-errors policy (CLAUDE.md).
      - name: Typecheck
        run: npm run typecheck

      # Includes docflow/no-hardcoded-type-name — Rule #5, one word everywhere.
      - name: Lint
        run: npm run lint

      # BEFORE the tests, and that order is deliberate.
      #
      # Three checks read the built bundle: the service-role key scan
      # (tools/pentest), the screenshot-fixture isolation check, and §T's
      # destination scan. Each of them says out loud when there is no build
      # rather than skipping silently — but with the tests running first,
      # "there is no build" was the answer every time, and none of the three
      # had ever actually run here.
      - name: Build
        run: npm run build

      # Blocking before merge: money property tests (fast-check), lifecycle
      # transition tests, and — since Phase 3 — the sync chaos suite
      # (CLAUDE.md: "Sync work additionally requires the chaos suite
      # scenarios it touches").
      - name: Money, lifecycle and sync chaos tests
        run: npm test

  rls:
    name: RLS — two-company isolation (§P, §Q gate)
    runs-on: ubuntu-latest

    # A bare Postgres, not a hosted Supabase project: the suite needs no
    # secrets, no network and has nothing to go stale. The migrations are
    # applied unmodified — only the roles a hosted project already provides
    # are created first, by supabase/tests/bootstrap.sql.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: docflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Two-company denial suite
        run: npm run test:rls
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/docflow_test
